name: Temporary sandbox validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sandbox-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax
        run: python -m py_compile worker/runner.py tools/validator_bridge.py
      - name: Lesson and sandbox validator
        run: node tools/validate.mjs
