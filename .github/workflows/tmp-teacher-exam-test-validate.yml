name: Temporary teacher exam test validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-teacher-exam-test-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check js/teacher.js
          node --check js/exam-app.js
      - name: Full validator
        run: node tools/validate.mjs
