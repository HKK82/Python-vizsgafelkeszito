name: Temporary v6 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-v6-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/exam-app.js
          node --check js/storage.js
          node --check js/checkpoints.js
          node --check js/checkpoint-exams.js
          node --check js/exams.js
      - name: Python syntax
        run: python -m py_compile worker/runner.py tools/validator_bridge.py
      - name: Full lesson and checkpoint validator
        run: node tools/validate.mjs
